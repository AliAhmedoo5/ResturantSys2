name: Domain foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain:
    name: Windows domain checks
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/pos_domain
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'
      - name: Resolve package on the hosted runner
        run: dart pub get
      - name: Format on hosted runner
        run: dart format lib test
      - name: Save prepared domain source
        uses: actions/upload-artifact@v4
        with:
          name: pos-domain-prepared-source
          path: |
            packages/pos_domain/lib
            packages/pos_domain/test
      - name: Analyze domain package
        run: dart analyze --fatal-infos
      - name: Run cash-rounding regression suite
        run: dart run test/cash_rounding_test.dart
      - name: Check command clock and record identifiers
        run: dart run test/command_environment_test.dart
      - name: Check Cashier and Manager permission boundaries
        run: dart run test/access_policy_test.dart
      - name: Require committed formatting
        run: |
          git diff --exit-code -- lib test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
