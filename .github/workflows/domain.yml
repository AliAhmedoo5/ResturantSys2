name: Domain foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain:
    name: Windows domain checks
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/pos_domain
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'
      - name: Resolve package on the hosted runner
        run: dart pub get
      - name: Check formatting
        run: dart format --output=show --set-exit-if-changed lib test
      - name: Analyze domain package
        run: dart analyze --fatal-infos
      - name: Run cash-rounding regression suite
        run: dart run test/cash_rounding_test.dart
