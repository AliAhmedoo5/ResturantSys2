name: Crunch Cartel Windows

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_lock:
        description: Resolve an intentionally changed dependency manifest
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Test and build Windows preview
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/crunch_cartel
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
      - name: Apply Crunch Cartel native branding on the hosted runner
        run: ../../tool/brand_windows.ps1
      - name: Resolve dependencies
        run: |
          if ('${{ inputs.refresh_lock }}' -eq 'true') { flutter pub get } else { flutter pub get --enforce-lockfile }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format source on the hosted runner
        run: dart format lib test
      - name: Save generated source for review and commit
        uses: actions/upload-artifact@v4
        with:
          name: crunch-cartel-prepared-source
          include-hidden-files: true
          path: |
            apps/crunch_cartel/lib
            apps/crunch_cartel/test
            apps/crunch_cartel/windows
            !apps/crunch_cartel/windows/flutter/ephemeral
            apps/crunch_cartel/pubspec.lock
            apps/crunch_cartel/.metadata
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test navigation, disabled checkout and DPI layouts
        run: flutter test --reporter expanded
      - name: Save UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crunch-cartel-ui-screenshots
          path: apps/crunch_cartel/build/preview-screenshots
          if-no-files-found: ignore
      - name: Verify domain under the bundled Dart SDK
        working-directory: packages/pos_domain
        run: |
          dart pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart analyze --fatal-infos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart run test/cash_rounding_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dart run test/command_environment_test.dart
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dart run test/access_policy_test.dart
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build release preview
        run: flutter build windows --release
      - name: Native application startup smoke check
        run: |
          $executable = Resolve-Path build/windows/x64/runner/Release/crunch_cartel.exe
          $appProcess = Start-Process -FilePath $executable -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 8
            $appProcess.Refresh()
            if ($appProcess.HasExited) { throw "Preview exited during startup: $($appProcess.ExitCode)" }
          } finally {
            if (!$appProcess.HasExited) { Stop-Process -Id $appProcess.Id }
          }
      - name: Include preview instructions
        run: Copy-Item -LiteralPath ../../docs/PREVIEW.md -Destination build/windows/x64/runner/Release/README.md
      - name: Enforce committed source formatting and dependency lock
        run: git diff --exit-code -- lib test pubspec.lock
      - name: Upload complete Windows application bundle
        uses: actions/upload-artifact@v4
        with:
          name: Crunch-Cartel-Windows-preview-${{ github.run_number }}
          path: apps/crunch_cartel/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30
