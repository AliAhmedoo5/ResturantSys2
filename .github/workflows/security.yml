name: Security foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: Windows PIN and key protection checks
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/pos_security
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'
      - name: Resolve on hosted runner
        run: |
          if (Test-Path pubspec.lock) { dart pub get --enforce-lockfile } else { dart pub get }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format on hosted runner
        run: dart format lib test
      - name: Save prepared security source
        uses: actions/upload-artifact@v4
        with:
          name: pos-security-prepared-source
          path: |
            packages/pos_security/lib
            packages/pos_security/test
            packages/pos_security/pubspec.lock
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test PIN verification and native Windows key protection
        run: dart test --reporter expanded
      - name: Require committed formatting and lockfile
        run: |
          git diff --exit-code -- lib test pubspec.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $untracked = git ls-files --others --exclude-standard -- lib test pubspec.lock
          if ($untracked) { throw 'Import hosted source and lockfile before verification.' }
